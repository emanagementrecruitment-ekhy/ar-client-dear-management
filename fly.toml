# fly.toml app configuration file generated for ar-client-dear-management on 2026-09-24T09:20:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ar-client-dear-management'
primary_region = 'sin'

[build]

[env]
  DATABASE_URL = 'file:/data/prod.db'
  PORT = '8080'

[[mounts]]
  source = 'dear_channel_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
