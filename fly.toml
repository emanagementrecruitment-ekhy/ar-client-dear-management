# DEAR Management Channel — Fly.io config.
# App name matches what was actually provisioned via the Fly.io "Launch an
# App from GitHub" UI (it named the app after the repo, ar-client-dear-management,
# not this file's original suggested name).
app = "ar-client-dear-management"
primary_region = "sin" # Singapore — closest Fly.io region to Indonesia

[build]

[env]
PORT = "8080"
DATABASE_URL = "file:/data/prod.db"

[[mounts]]
source = "dear_channel_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
